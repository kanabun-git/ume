ja:
  activerecord:
    models:
      shift: 出勤予定
      cast: キャスト
      shop: 店舗
      diary_entry: 写メ日記
      shop_inquiry: 掲載のお問い合わせ
    attributes:
      shift:
        work_date: 出勤日
        start_time: 開始時刻
        end_time: 終了時刻
        ends_next_day: 翌日にまたぐ
        note: 備考
        status: 状態
      shop:
        name: 店舗名
        business_hours: 営業時間
        time_display_format: 時刻の表記方法
      diary_entry:
        title: タイトル
        body: 本文
        video: 動画
      shop_page_block:
        video_file: 動画ファイル
      shop_inquiry:
        shop_name: 店舗名
        contact_name: ご担当者名
        email: メールアドレス
        phone: 電話番号
        area_note: 希望エリア
        message: お問い合わせ内容
      outreach_email_template:
        subject: 件名
        body: 本文
  # Kaminari's own gem locale file (kaminari-core) only ships English
  # strings -- without this, every paginated screen shows raw
  # "translation missing: ja.views.pagination.next" text. Went unnoticed
  # until 営業先候補管理 became the first admin list with enough rows
  # (200+) to actually need more than one page.
  views:
    pagination:
      first: "&laquo; 最初"
      last: "最後 &raquo;"
      previous: "&lsaquo; 前へ"
      next: "次へ &rsaquo;"
      truncate: "&hellip;"
  helpers:
    page_entries_info:
      one_page:
        display_entries:
          zero: 0件
          one: 1件
          other: "%{count}件"
      more_pages:
        display_entries: "全%{total}件中 %{first}&nbsp;-&nbsp;%{last}件を表示"
