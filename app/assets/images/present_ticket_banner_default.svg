<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="present-banner-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6f9c"/>
      <stop offset="100%" stop-color="#b5204f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#present-banner-bg)"/>

  <!-- Simple gift box icon -->
  <g transform="translate(140,90)" fill="#ffffff">
    <rect x="0" y="45" width="120" height="75" rx="4"/>
    <rect x="-6" y="20" width="132" height="30" rx="4"/>
    <rect x="52" y="0" width="16" height="120"/>
    <path d="M60,20 C40,20 30,0 46,0 C58,0 60,12 60,20 Z"/>
    <path d="M60,20 C80,20 90,0 74,0 C62,0 60,12 60,20 Z"/>
  </g>

  <text x="330" y="150" font-family="'Hiragino Sans', 'Helvetica Neue', Arial, sans-serif"
        font-size="64" font-weight="800" fill="#ffffff" stroke="#7a1636" stroke-width="4"
        paint-order="stroke fill">プレゼント企画実施中!</text>
  <text x="330" y="200" font-family="'Hiragino Sans', 'Helvetica Neue', Arial, sans-serif"
        font-size="32" fill="#ffffff" fill-opacity="0.9">豪華賞品が当たるチャンス</text>
</svg>
